<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petek Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
</head>
<body>
    <div class="weather-card">
        <h2>Petek</h2>
        <p class="subtitle">Weather App</p>

        <form id="weatherForm">
            <input type="text" id="cityInput" placeholder="Enter city name..." aria-label="City name" required>
            <button type="submit">Search</button>
        </form>

        <p id="message">Search a city to see its weather</p>

        <section id="weatherInfo" class="weather-info" hidden>
            <h3 id="cityName"></h3>
            <img id="weatherIcon" alt="Weather icon">
            <h1 id="temperature">--°C</h1>
            <p id="description"></p>

            <div class="details">
                <div>
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div>
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind">-- m/s</strong>
                </div>
            </div>
        </section>

        <footer>Made with ❤️ by Petek</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
